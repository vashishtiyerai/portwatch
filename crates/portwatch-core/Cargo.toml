[package]
name = "portwatch-core"
version = "0.1.0"
edition = "2021"
authors = ["PortWatch Contributors"]
license = "MIT"
description = "Core system port & process provider abstractions for PortWatch"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
