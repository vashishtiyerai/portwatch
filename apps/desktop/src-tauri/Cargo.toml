[package]
name = "portwatch-desktop"
version = "0.1.0"
description = "PortWatch desktop application shell"
authors = ["PortWatch Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portwatch-core = { path = "../../../crates/portwatch-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
